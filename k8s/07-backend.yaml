apiVersion: apps/v1
kind: Deployment
metadata:
  name: civicissue-backend
  namespace: civicissue
spec:
  replicas: 2
  selector:
    matchLabels:
      app: civicissue-backend
  template:
    metadata:
      labels:
        app: civicissue-backend
    spec:
      containers:
        - name: backend
          image: <YOUR_IMAGE>:latest
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: civicissue-config
            - secretRef:
                name: civicissue-secrets
          env:
            - name: SPRING_DATASOURCE_URL
              value: jdbc:postgresql://postgres:5432/civicissue
            - name: SPRING_DATASOURCE_USERNAME
              value: postgres
            - name: SPRING_DATA_MONGODB_URI
              value: mongodb://mongo:27017/civicissue
            - name: SPRING_DATA_REDIS_HOST
              value: redis
            - name: SPRING_DATA_REDIS_PORT
              value: "6379"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: kafka:9092
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 8080
            initialDelaySeconds: 40
            periodSeconds: 15
          resources:
            requests:
              cpu: 250m
              memory: 512Mi
            limits:
              cpu: "1"
              memory: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: civicissue
spec:
  selector:
    app: civicissue-backend
  ports:
    - port: 8080
      targetPort: 8080
