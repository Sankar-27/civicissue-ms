# Render Blueprint for CivicIssue
# Deploy by pushing this repo to GitHub and creating a new Blueprint on Render
# (https://render.com/docs/blueprint-spec) OR use "Deploy to Render".

services:
  # ─── FastAPI backend ─────────────────────────────────────────
  - type: web
    name: civicissue-api
    runtime: python
    rootDir: backend
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.11
      - key: DATABASE_URL
        fromDatabase:
          name: civicissue-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE_MINUTES
        value: 1440
      # Must match the exact URL of the frontend service below.
      - key: CORS_ORIGINS
        value: https://civicissue-frontend.onrender.com

  # ─── React frontend (static site) ────────────────────────────
  - type: web
    name: civicissue-frontend
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      # URL of the API service above (inlined into the bundle at build time).
      - key: VITE_API_URL
        value: https://civicissue-api.onrender.com

# ─── PostgreSQL database ───────────────────────────────────────
databases:
  - name: civicissue-db
    databaseName: civicissue
    databaseUser: civicissue
    plan: free
